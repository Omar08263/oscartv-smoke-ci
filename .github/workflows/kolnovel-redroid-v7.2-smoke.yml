name: kolnovel-redroid-v7.2-smoke
# Kolnovel v7.2 SMOKE — the gate before any wider v7.2 verification.
# Checks: v7.2 installs + launches, cold open of 38916 via search (the v6c
# 2/2 crash path) does not crash, "تصدير PDF" is visible with NO scrolling,
# and ONE tap starts PdfExportActivity. See
# scripts/kolnovel-redroid-v7.2-smoke.sh for the full contract.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kolnovel-redroid-v7.2-smoke.yml'
      - 'scripts/kolnovel-redroid-v7.2-smoke.sh'
      - 'app/Kolnovel-v5.2.5-premium-v7.2.apk'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Redroid v7.2 smoke — install, cold detail-open, button visible, one tap
        run: bash scripts/kolnovel-redroid-v7.2-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-redroid-v7.2-smoke-artifacts
          path: artifacts/
