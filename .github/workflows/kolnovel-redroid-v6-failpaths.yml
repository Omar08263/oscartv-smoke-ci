name: kolnovel-redroid-v6-failpaths
# Kolnovel v6 — failure paths (problem 2, V6): Case A bogus titleId (404)
# and Case B airplane mode mid-fetch on a real novel. Clean failure =
# error toast, NO print job, NO PDF, NO crash, Activity finishes.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kolnovel-redroid-v6-failpaths.yml'
      - 'scripts/kolnovel-redroid-v6-failpaths.sh'
  workflow_dispatch:
jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Redroid v6 failure paths (404 + airplane mid-fetch)
        run: bash scripts/kolnovel-redroid-v6-failpaths.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-redroid-v6-failpaths-artifacts
          path: artifacts/
