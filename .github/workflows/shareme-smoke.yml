name: shareme-smoke
on:
  push:
    branches: [main]
    paths:
      - 'app/ShareMe-v3.48.05-premium.apk'
      - '.github/workflows/shareme-smoke.yml'
      - 'scripts/shareme-smoke.sh'
      - 'scripts/check_shareme.py'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          script: bash scripts/shareme-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shareme-smoke-artifacts
          path: artifacts/
