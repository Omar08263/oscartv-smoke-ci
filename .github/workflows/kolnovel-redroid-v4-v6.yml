name: kolnovel-redroid-v4-v6
# Kolnovel v4 - V6 failure-path test on REAL arm64 (Redroid).
# Case A: bogus titleId -> clean error, no print job, no partial PDF.
# Case B: real novel + airplane mode mid-fetch -> clean error, no print job.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kolnovel-redroid-v4-v6.yml'
      - 'scripts/kolnovel-redroid-v4-v6.sh'
  workflow_dispatch:
jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Redroid v4 V6 failure-path test
        run: bash scripts/kolnovel-redroid-v4-v6.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-redroid-v4-v6-artifacts
          path: artifacts/
