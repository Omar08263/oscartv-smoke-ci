name: tango-download
on:
  push:
    paths:
      - '.github/workflows/tango-download.yml'
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Tango 9.83.7 APK from APKMirror (direct download.php)
        run: |
          UA="Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Mobile Safari/537.36"
          URL="https://www.apkmirror.com/wp-content/themes/APKMirror/download.php?id=16894687&key=6ec64eb0ffba911c9e8c5441dece03469d6555c9"
          curl -sL -m 600 -A "$UA" -e "https://www.apkmirror.com/apk/tango/tango-tango/tango-live-stream-video-chat-9-83-7-release/tango-live-stream-video-chat-9-83-7-android-apk-download/" -o tango-original.apk "$URL" -w "HTTP:%{http_code} SIZE:%{size_download}\n"
          ls -la tango-original.apk
          file tango-original.apk
          head -c 2 tango-original.apk | od -An -tx1 | grep -q "50 4b" || (echo "NOT A ZIP/APK - first bytes:"; head -c 300 tango-original.apk; exit 1)
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tango-original-apk
          path: tango-original.apk
          if-no-files-found: error
