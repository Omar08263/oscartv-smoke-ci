name: kolnovel-redroid-v6-reflect
# Kolnovel v6 — reflection auto-save test (problem 4, attempt 1): the
# ReflectTest APK tries direct PrintDocumentAdapter onLayout/onWrite via
# sun.misc.Unsafe-allocated callback instances. Verdict line:
# REFLECT_AUTO_SAVE=POSSIBLE or =IMPOSSIBLE: <reason>.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kolnovel-redroid-v6-reflect.yml'
      - 'scripts/kolnovel-redroid-v6-reflect.sh'
      - 'app/ReflectTest-v1.apk'
  workflow_dispatch:
jobs:
  redroid:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Redroid v6 reflection auto-save test
        run: bash scripts/kolnovel-redroid-v6-reflect.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-redroid-v6-reflect-artifacts
          path: artifacts/
