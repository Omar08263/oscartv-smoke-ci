name: kolnovel-redroid-v7-verify
# Kolnovel v7 FULL VERIFICATION matrix on Redroid (ubuntu-24.04-arm only).
# 6 parallel jobs, one per verification item (see VERIFY-V7.md for verdicts):
#   ab     — item 1: 3 rounds x 4 cold opens v7 vs v3 (12+12) + 3 button presses
#   parts  — item 4: Part 3 alone (1001-1500) + Part 2 re-verify, each x2 attempts
#   retry  — item 5: renderer kill mid-print -> Arabic retry dialog -> retry to PDF
#   wide   — item 6: broad sweep (home/library/search/novel/reader/account/nav)
#   fold   — item 3: fold stress (3x scroll up/down) then button tap
#   api34  — item 7: one 76237 export on Redroid 14 (SDK 34 confirmed)
# Item 2 (button presses) is covered inside the ab job (1 press per round).
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kolnovel-redroid-v7-verify.yml'
      - 'scripts/kolnovel-redroid-v7-common.sh'
      - 'scripts/kolnovel-redroid-v7-verify-ab.sh'
      - 'scripts/kolnovel-redroid-v7-verify-parts.sh'
      - 'scripts/kolnovel-redroid-v7-verify-retry.sh'
      - 'scripts/kolnovel-redroid-v7-verify-wide.sh'
      - 'scripts/kolnovel-redroid-v7-verify-fold.sh'
      - 'scripts/kolnovel-redroid-v7-verify-api34.sh'
      - 'app/Kolnovel-v5.2.5-premium-v7.apk'
      - 'app/Kolnovel-v5.2.5-premium-v3.apk'
  workflow_dispatch:
jobs:
  ab:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: A/B crash matrix 3x4 v7 vs v3 + 3 button presses
        run: bash scripts/kolnovel-redroid-v7-verify-ab.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-v7-verify-ab
          path: artifacts/
  parts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Parts 3 + 2 on v7 (2 attempts each)
        run: bash scripts/kolnovel-redroid-v7-verify-parts.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-v7-verify-parts
          path: artifacts/
  retry:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Renderer-death retry dialog proof
        run: bash scripts/kolnovel-redroid-v7-verify-retry.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-v7-verify-retry
          path: artifacts/
  wide:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Broad sweep on v7
        run: bash scripts/kolnovel-redroid-v7-verify-wide.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-v7-verify-wide
          path: artifacts/
  fold:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fold stress then button tap
        run: bash scripts/kolnovel-redroid-v7-verify-fold.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-v7-verify-fold
          path: artifacts/
  api34:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: API 34 auto-save on v7
        run: bash scripts/kolnovel-redroid-v7-verify-api34.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kolnovel-v7-verify-api34
          path: artifacts/
